<!DOCTYPE html>
<html>
<head>
  <title>Payment Successful</title>
  <script type="module">
    import { auth, db } from "./firebase.js";
    import { doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    onAuthStateChanged(auth, async user => {
      if (!user) return alert("Login required");

      // Credit wallet (R50 for this example)
      const walletRef = doc(db, "wallets", user.uid);
      await updateDoc(walletRef, {
        balance: increment(50)
      });

      alert("Payment successful! R50 added to your wallet.");
      window.location.href = "wallet.html"; // redirect to wallet page
    });
  </script>
</head>
<body>
<h2>Payment Successful!</h2>
<p>Redirecting...</p>
</body>
</html>
